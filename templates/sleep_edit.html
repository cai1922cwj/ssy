{% extends "base.html" %}

{% block content %}
<h2><i class="bi bi-pencil-square text-primary"></i> 编辑睡眠记录</h2>

<div class="card mt-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-moon-stars"></i> 修改睡眠数据</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('edit_sleep', record_id=record.id) }}" id="editSleepForm">
            <!-- 基础信息 -->
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <label class="form-label"><i class="bi bi-moon"></i> 入睡时间</label>
                    <input type="datetime-local" name="bed_time" id="bed_time" class="form-control"
                           value="{{ record.bed_time.strftime('%Y-%m-%dT%H:%M') if record.bed_time else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label"><i class="bi bi-sun"></i> 醒来时间</label>
                    <input type="datetime-local" name="wake_time" id="wake_time" class="form-control"
                           value="{{ record.wake_time.strftime('%Y-%m-%dT%H:%M') if record.wake_time else '' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-clock"></i> 睡眠时长</label>
                    <input type="number" step="0.1" name="duration" id="duration" class="form-control"
                           value="{{ '%.1f'|format(record.duration) if record.duration else '7' }}" readonly>
                    <small class="text-muted">自动计算</small>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-star"></i> 睡眠质量</label>
                    <select name="quality" id="quality" class="form-select">
                        <option value="10" {% if record.quality == 10 %}selected{% endif %}>10 - 非常好</option>
                        <option value="8" {% if record.quality == 8 %}selected{% endif %}>8 - 良好</option>
                        <option value="6" {% if record.quality == 6 %}selected{% endif %}>6 - 一般</option>
                        <option value="4" {% if record.quality == 4 %}selected{% endif %}>4 - 较差</option>
                        <option value="2" {% if record.quality == 2 %}selected{% endif %}>2 - 很差</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">影响因素</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="caffeine" id="caffeine"
                               {% if record.caffeine_before_bed %}checked{% endif %}>
                        <label class="form-check-label" for="caffeine">睡前咖啡</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="heavy_meal" id="heavy_meal"
                               {% if record.heavy_meal_before_bed %}checked{% endif %}>
                        <label class="form-check-label" for="heavy_meal">睡前饱餐</label>
                    </div>
                </div>
            </div>
            
            <!-- 睡眠分期 -->
            <div class="card bg-light mb-3">
                <div class="card-header">
                    <h6 class="mb-0"><i class="bi bi-pie-chart"></i> 睡眠分期 (分钟)</h6>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label text-success">
                                <i class="bi bi-moon-fill"></i> 深睡眠
                            </label>
                            <div class="input-group">
                                <input type="number" name="deep_sleep" id="deep_sleep" class="form-control" 
                                       value="{{ record.deep_sleep|int if record.deep_sleep else 0 }}" min="0">
                                <span class="input-group-text">分钟</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-info">
                                <i class="bi bi-circle-half"></i> 浅睡眠
                            </label>
                            <div class="input-group">
                                <input type="number" name="light_sleep" id="light_sleep" class="form-control" 
                                       value="{{ record.light_sleep|int if record.light_sleep else 0 }}" min="0">
                                <span class="input-group-text">分钟</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" style="color:#9333ea">
                                <i class="bi bi-lightning-charge"></i> REM
                            </label>
                            <div class="input-group">
                                <input type="number" name="rem_sleep" id="rem_sleep" class="form-control" 
                                       value="{{ record.rem_sleep|int if record.rem_sleep else 0 }}" min="0">
                                <span class="input-group-text">分钟</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-secondary">
                                <i class="bi bi-eye"></i> 清醒时间
                            </label>
                            <div class="input-group">
                                <input type="number" name="awake_time" id="awake_time" class="form-control" 
                                       value="{{ record.awake_time|int if record.awake_time else 0 }}" min="0">
                                <span class="input-group-text">分钟</span>
                            </div>
                        </div>
                    </div>
                    <!-- 占比预览 -->
                    <div class="mt-3" id="sleepRatioPreview">
                        <label class="form-label">睡眠分期占比</label>
                        <div class="progress" style="height: 24px;">
                            <div class="progress-bar bg-success" id="deepRatio" style="width: 0%">深睡 <span id="deepPct">0%</span></div>
                            <div class="progress-bar bg-info" id="lightRatio" style="width: 0%">浅睡 <span id="lightPct">0%</span></div>
                            <div class="progress-bar" id="remRatio" style="width: 0%; background: #9333ea">REM <span id="remPct">0%</span></div>
                            <div class="progress-bar bg-secondary" id="awakeRatio" style="width: 0%">清醒</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 备注 -->
            <div class="mt-3">
                <label class="form-label">备注</label>
                <input type="text" name="notes" class="form-control" value="{{ record.notes or '' }}" placeholder="可选">
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-lg"></i> 保存修改
                </button>
                <a href="{{ url_for('sleep') }}" class="btn btn-secondary ms-2">
                    <i class="bi bi-x"></i> 取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<script>
// 自动计算睡眠时长
function calculateDuration() {
    const bedTime = document.getElementById('bed_time').value;
    const wakeTime = document.getElementById('wake_time').value;
    const durationInput = document.getElementById('duration');
    
    if (bedTime && wakeTime) {
        const bed = new Date(bedTime);
        let wake = new Date(wakeTime);
        
        if (wake < bed) {
            wake.setDate(wake.getDate() + 1);
        }
        
        const diffMs = wake - bed;
        const hours = diffMs / (1000 * 60 * 60);
        
        if (hours > 0 && hours <= 24) {
            durationInput.value = hours.toFixed(1);
        }
    }
}

// 计算睡眠分期占比
function calculateSleepRatio() {
    const deepSleep = parseInt(document.getElementById('deep_sleep').value) || 0;
    const lightSleep = parseInt(document.getElementById('light_sleep').value) || 0;
    const remSleep = parseInt(document.getElementById('rem_sleep').value) || 0;
    const awakeTime = parseInt(document.getElementById('awake_time').value) || 0;
    
    const total = deepSleep + lightSleep + remSleep + awakeTime;
    
    if (total > 0) {
        const deepPct = Math.round(deepSleep / total * 100);
        const lightPct = Math.round(lightSleep / total * 100);
        const remPct = Math.round(remSleep / total * 100);
        const awakePct = 100 - deepPct - lightPct - remPct;
        
        document.getElementById('deepRatio').style.width = deepPct + '%';
        document.getElementById('deepPct').textContent = deepPct + '%';
        
        document.getElementById('lightRatio').style.width = lightPct + '%';
        document.getElementById('lightPct').textContent = lightPct + '%';
        
        document.getElementById('remRatio').style.width = remPct + '%';
        document.getElementById('remPct').textContent = remPct + '%';
        
        document.getElementById('awakeRatio').style.width = Math.max(0, awakePct) + '%';
    }
}

// 事件监听
document.getElementById('bed_time').addEventListener('change', calculateDuration);
document.getElementById('wake_time').addEventListener('change', calculateDuration);
document.getElementById('deep_sleep').addEventListener('input', calculateSleepRatio);
document.getElementById('light_sleep').addEventListener('input', calculateSleepRatio);
document.getElementById('rem_sleep').addEventListener('input', calculateSleepRatio);
document.getElementById('awake_time').addEventListener('input', calculateSleepRatio);

// 初始化
calculateSleepRatio();
calculateDuration();
</script>
{% endblock %}
