{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <i class="bi bi-heart-pulse display-4 text-primary"></i>
                    <h3 class="mt-2">登录熵食源</h3>
                    <p class="text-muted">开启您的健康之旅</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-envelope me-2"></i>邮箱</label>
                        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-key me-2"></i>密码</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>登录
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">
                        还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
