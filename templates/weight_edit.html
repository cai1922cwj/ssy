{% extends "base.html" %}

{% block content %}
<h2><i class="bi bi-pencil-square text-info"></i> 编辑体重记录</h2>

<div class="card mt-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-pencil"></i> 修改体重数据</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('edit_weight', record_id=record.id) }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">日期</label>
                    <input type="date" name="date" class="form-control" value="{{ record.date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">体重 (kg)</label>
                    <input type="number" step="0.1" name="weight" class="form-control" 
                           value="{{ record.weight }}" min="10" max="500" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">体脂率 (%)</label>
                    <input type="number" step="0.1" name="body_fat" class="form-control" 
                           value="{{ record.body_fat or '' }}" min="0" max="70">
                </div>
                <div class="col-md-6">
                    <label class="form-label">备注</label>
                    <input type="text" name="notes" class="form-control" 
                           value="{{ record.notes or '' }}" placeholder="可选备注">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check"></i> 保存修改
                </button>
                <a href="{{ url_for('weight') }}" class="btn btn-secondary ms-2">
                    <i class="bi bi-x"></i> 取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
