{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus display-4 text-primary"></i>
                    <h3 class="mt-2">注册熵食源</h3>
                    <p class="text-muted">创建您的健康账户</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person me-2"></i>用户名</label>
                        <input type="text" name="username" class="form-control" required placeholder="您的用户名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-envelope me-2"></i>邮箱</label>
                        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-key me-2"></i>密码</label>
                        <input type="password" name="password" class="form-control" required minlength="6" placeholder="至少6位">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle me-2"></i>注册
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">
                        已有账号？<a href="{{ url_for('login') }}">立即登录</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
