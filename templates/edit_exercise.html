{% extends "base.html" %}

{% block content %}
<h2><i class="bi bi-pencil-square text-primary"></i> 编辑运动记录</h2>

<form method="POST" class="card mt-4">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">运动名称</label>
            <input type="text" name="exercise_name" class="form-control" value="{{ record.exercise_name }}" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">运动时长 (分钟)</label>
                <input type="number" name="duration" class="form-control" value="{{ record.duration }}" min="1" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">运动强度</label>
                <select name="intensity" class="form-select">
                    <option value="low" {% if record.intensity == 'low' %}selected{% endif %}>低强度</option>
                    <option value="moderate" {% if record.intensity == 'moderate' %}selected{% endif %}>中等强度</option>
                    <option value="high" {% if record.intensity == 'high' %}selected{% endif %}>高强度</option>
                </select>
            </div>
        </div>

        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i>
            当前消耗: <span class="fw-bold">{{ record.calories_burned|int }}</span> kcal
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> 保存修改
            </button>
            <a href="{{ url_for('exercise') }}" class="btn btn-secondary">
                <i class="bi bi-x"></i> 取消
            </a>
        </div>
    </div>
</form>
{% endblock %}
