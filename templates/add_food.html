{% extends "base.html" %}

{% block content %}
<h2><i class="bi bi-plus-circle text-primary"></i> 添加自定义食物</h2>

<form method="POST" class="card">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">食物名称 *</label>
            <input type="text" name="name" class="form-control" required placeholder="例如: 妈妈做的红烧肉">
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">分类</label>
                <select name="category" class="form-select">
                    <option value="">选择分类</option>
                    <option value="主食">主食</option>
                    <option value="肉类">肉类</option>
                    <option value="蔬菜">蔬菜</option>
                    <option value="水果">水果</option>
                    <option value="饮品">饮品</option>
                    <option value="蛋类">蛋类</option>
                    <option value="坚果">坚果</option>
                    <option value="快餐">快餐</option>
                    <option value="中式主食">中式主食</option>
                    <option value="豆制品">豆制品</option>
                    <option value="其他">其他</option>
                </select>
            </div>
        </div>
        
        <hr>
        <h5>营养成分 (每100g)</h5>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">热量 (kcal) *</label>
                <input type="number" step="0.1" name="calories" class="form-control" required value="0">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">蛋白质 (g)</label>
                <input type="number" step="0.1" name="protein" class="form-control" value="0">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">碳水化合物 (g)</label>
                <input type="number" step="0.1" name="carbs" class="form-control" value="0">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">脂肪 (g)</label>
                <input type="number" step="0.1" name="fat" class="form-control" value="0">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">膳食纤维 (g)</label>
                <input type="number" step="0.1" name="fiber" class="form-control" value="0">
            </div>
        </div>
        
        <div class="alert alert-info">
            <i class="bi bi-lightbulb me-2"></i>
            <strong>提示:</strong> 添加家庭食谱或加工食品时，可以查看包装上的营养成分表获取数据。
        </div>
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check"></i> 保存食物
            </button>
            <a href="{{ url_for('foods') }}" class="btn btn-secondary">
                <i class="bi bi-x"></i> 取消
            </a>
        </div>
    </div>
</form>
{% endblock %}
